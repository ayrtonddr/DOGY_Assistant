[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dogy-assistant"
version = "0.1.0"
description = "DOGY local-first family AI assistant foundation"
requires-python = ">=3.11,<3.14"
dependencies = []
[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
[project.scripts]
dogy = "dogy.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
