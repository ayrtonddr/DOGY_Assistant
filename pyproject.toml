[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dogy-assistant"
version = "0.1.0"
description = "DOGY local-first family AI assistant foundation"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
[project.scripts]
dogy = "dogy.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
