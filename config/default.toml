[assistant]
name = "DOGY"
language = "en"
cloud_enabled = false
network_inference_enabled = false
[security]
tools_enabled = false
family_accounts_enabled = false
[storage]
state_dir = "state"
[llm]
# Offline remains the safe default. For local Ollama, set backend = "ollama".
# Remote inference requires separate authentication and transport work.
backend = "disabled"
model = "qwen2.5:3b"
endpoint = "http://127.0.0.1:11434"
timeout = 90
max_tokens = 160
